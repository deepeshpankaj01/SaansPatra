name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install dependencies
        run: pnpm install

      - name: Type check
        run: tsc --noEmit

      - name: Lint
        run: pnpm exec eslint .

      - name: Unit tests
        run: pnpm exec vitest run

      - name: Build
        run: pnpm exec next build

      - name: Audit
        run: npm audit --audit-level=high
